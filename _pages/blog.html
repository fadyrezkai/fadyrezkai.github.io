---
title: "Blog"
permalink: /blog/
layout: plain
---

<section class="section" id="posts">
  <h2 class="section-title">Posts</h2>
  <div class="section-body">
    <ul class="pub-list">
      {%- for post in site.posts -%}
      <li class="pub">
        <div class="pub-badge"><span>{{ post.date | date: "%b %Y" }}</span></div>
        <div class="pub-body">
          <span class="pub-title"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></span>
          <span class="pub-note">{{ post.content | strip_html | truncatewords: 40 }}</span>
        </div>
      </li>
      {%- endfor -%}
    </ul>
  </div>
</section>
